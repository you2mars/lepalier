[supervisord]
nodaemon=true
[program:api]
command=uv run uvicorn --factory app.main:application --host 0.0.0.0 --port 8000 --workers 2
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
[program:worker]
command=uv run python -m app.worker
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
