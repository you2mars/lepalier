[project]
name = "svc-identity"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "nats-py>=2.9",
  "argon2-cffi>=23.1",
  "cryptography>=43",
  "commun",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov",
  "hypothesis>=6",
  "httpx",
  "testcontainers[postgres]>=4.8",
  "mypy",
  "ruff",
]

[tool.uv.sources]
commun = { path = "../../libs/commun", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --cov=app --cov-report=term-missing"
markers = ["integration: nécessite Docker (PostgreSQL via Testcontainers)"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
