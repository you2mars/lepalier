; API + worker du service, lancés depuis l'environnement construit dans l'image, sans passer par uv, qui
; pourrait réinstaller des dépendances au démarrage)
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
[program:api]
directory=/srv/services/__SERVICE__
command=/srv/services/__SERVICE__/.venv/bin/uvicorn --factory app.main:application --host 0.0.0.0 --port 8000 --workers 2
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
[program:worker]
directory=/srv/services/__SERVICE__
command=/srv/services/__SERVICE__/.venv/bin/python -m app.worker
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
