# nginx de développement : même routage et mêmes écrasements d'en-têtes qu'en prod, TLS auto-signé (make dev-certs).
# La configuration de production complète (TLS Let's Encrypt, CSP nonce, interrupteur de maintenance) est au
# § 11.3 de SPEC_TECHNIQUE.md et sera écrite dans nginx.prod.conf au lot 2.
# Le serveur est dans templates/lepalier.conf.template (variables LEPALIER_* remplacées au démarrage).
worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  # résolveur de Docker : les services absents (lots suivants) n'empêchent pas nginx de démarrer
  resolver 127.0.0.11 valid=10s ipv6=off;
  # service arrêté (R0-36) : son nom ne se résout plus, ou son ancienne adresse, encore en mémoire, ne répond plus ;
  # erreur 5xx en 2 s au lieu d'une attente de 30 à 60 s (réseau Docker interne : une connexion saine est immédiate)
  resolver_timeout 2s;
  proxy_connect_timeout 2s;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  # pas de session : jamais de cache pour la vérification d'identité
  map $cookie_lp_session $sans_session { "" 1; default 0; }
  # /api/identity/auth/* : 10 par minute et par adresse, rafale de 10 (ADR 0006) ; un double clic passe toujours
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_status 429;
  # cache d'auth_request : 10 s par cookie de session (TEC-WEB-03) ; une révocation prend effet au plus 10 s après
  proxy_cache_path /var/cache/nginx/auth levels=1:2 keys_zone=cache_auth:1m max_size=10m inactive=1m use_temp_path=off;
  log_format json escape=json '{"t":"$time_iso8601","rid":"$request_id","ip":"$remote_addr","m":"$request_method","uri":"$uri","s":$status,"up":"$upstream_addr","ut":"$upstream_response_time"}';
  access_log /dev/stdout json;
  include /etc/nginx/conf.d/*.conf;
}
