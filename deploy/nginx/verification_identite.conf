# Vérification d'identité pour nginx seul (auth_request), cache de 10 s par session (inclus par chaque serveur).
location = /_auth {
  internal;
  set $identity identity:8000;
  proxy_pass http://$identity/auth/verify;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header Cookie $http_cookie;
  proxy_set_header X-Request-Id $request_id;
  proxy_cache cache_auth;
  proxy_cache_key $cookie_lp_session;
  proxy_cache_valid 200 10s;
  proxy_cache_bypass $sans_session;
  proxy_no_cache $sans_session;
  proxy_ignore_headers Cache-Control Expires Set-Cookie;
}
