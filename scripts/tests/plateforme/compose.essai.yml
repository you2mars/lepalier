# Ajouts au projet d'essai lepalier-essai (make test-plateforme), jamais à la plateforme de dev :
# un faux front qui renvoie en JSON les en-têtes reçus, pour vérifier ce que nginx lui transmet.
services:
  front:
    image: ghcr.io/you2mars/app-base:latest
    pull_policy: never
    command:
      - python
      - -c
      - |
        import json
        from http.server import BaseHTTPRequestHandler, HTTPServer
        class Echo(BaseHTTPRequestHandler):
            def do_GET(self):
                corps = json.dumps({k.lower(): v for k, v in self.headers.items()}).encode()
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(corps)
        HTTPServer(("0.0.0.0", 3000), Echo).serve_forever()
    networks: [edge]
    # l'image app-base n'a pas wget (vérification du vrai front) : curl
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3000/"]
