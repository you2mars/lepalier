# Configuration commune ruff / mypy (chaque service a son propre pyproject pour les dépendances)
[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "RUF"]
ignore = ["S101"]
[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_any_generics = true
