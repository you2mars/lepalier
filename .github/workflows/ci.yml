name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Contrats (même environnement qu'en local, formats date-time compris)
        run: make contracts
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Dépendances Python (pip-audit) et du front (npm audit) ; échec sur une vulnérabilité haute, critique ou inconnue
        run: make audit
  commun:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/commun
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Dépendances (Python de .python-version, versions de uv.lock)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Typage (mypy strict)
        run: uv run mypy src/commun tests
      - name: Tests et couverture ≥ 95 % (PostgreSQL 16 et NATS par Testcontainers)
        run: uv run pytest
      - name: Outillage (make dev-secrets, ADR 0007) dans des dossiers temporaires
        working-directory: .
        run: uv run --project libs/commun pytest -q -p no:cacheprovider scripts/tests
  gabarit:
    runs-on: ubuntu-latest
    needs: commun
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Lint du gabarit, typage et tests d'un service généré (PostgreSQL 16 par Testcontainers)
        run: make test-gabarit
  services:
    runs-on: ubuntu-latest
    needs: [contracts, commun]
    strategy:
      fail-fast: false
      matrix:
        service: [identity, referentiel, facturation, charges-eau, documents, envois, veille, reporting]
    steps:
      - uses: actions/checkout@v4
      - name: Service présent ?
        id: present
        run: echo "ok=$([ -d services/${{ matrix.service }} ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v3
        if: steps.present.outputs.ok == 'true'
      - name: Dépendances
        if: steps.present.outputs.ok == 'true'
        run: cd services/${{ matrix.service }} && uv sync --all-extras
      - name: Lint, typage, tests
        if: steps.present.outputs.ok == 'true'
        run: |
          cd services/${{ matrix.service }}
          uv run ruff check . && uv run ruff format --check .
          if [ -d app/engines ]; then uv run mypy --strict app/engines; fi
          uv run pytest --cov-fail-under=80
          # moteurs (fonctions pures) : 95 % au moins, bloquant (étape 8 du lot 0)
          if [ -d app/engines ]; then uv run coverage report --include='app/engines/*' --fail-under=95; fi
  front:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Front présent ?
        id: present
        run: echo "ok=$([ -f front/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.present.outputs.ok == 'true'
        run: cd front && npm ci && npm run lint && npx tsc --noEmit && npm test --if-present
  app-base:
    if: github.ref == 'refs/heads/main'
    needs: [services, front]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/app-base.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/app-base:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/app-base:latest
  images:
    if: github.ref == 'refs/heads/main'
    # les images des services partent de app-base:latest, publiée juste avant
    needs: [app-base]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [identity, referentiel, facturation, charges-eau, documents, envois, veille, reporting]
    steps:
      - uses: actions/checkout@v4
      - name: Service présent ?
        id: present
        run: echo "ok=$([ -d services/${{ matrix.service }} ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: steps.present.outputs.ok == 'true'
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        if: steps.present.outputs.ok == 'true'
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:main
  # Déploiement : environnement GitHub "preprod" (auto) puis "prod" (approbation manuelle), exécutés par le runner auto-hébergé
  # du VPS en mode pull — job à ajouter au lot 2 (TEC-QA-05, TEC-OPS-01).
  image-front:
    if: github.ref == 'refs/heads/main'
    needs: [front]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Front présent ?
        id: present
        run: echo "ok=$([ -f front/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: steps.present.outputs.ok == 'true'
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        if: steps.present.outputs.ok == 'true'
        with:
          context: .
          file: front/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/front:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/front:main
