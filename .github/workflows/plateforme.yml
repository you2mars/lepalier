name: plateforme
# Essai réel des images, de Compose et de nginx (make test-plateforme), seulement quand ils changent.
on:
  pull_request:
    paths:
      - "deploy/**"
      - "compose*.yml"
      - "**/Dockerfile"
      - "**/supervisord.conf"
      - ".dockerignore"
      - "Makefile"
      - "scripts/tests/test_plateforme.py"
      - "scripts/tests/plateforme/**"
      - "front/**"
      - "contracts/libelles/**"
      - ".github/workflows/plateforme.yml"
permissions:
  contents: read
jobs:
  plateforme:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Dépendances du front (Playwright les lit dans le dépôt monté)
        run: cd front && npm ci
      - name: Dossier des résultats Playwright (traces et captures, gardés en cas d'échec)
        run: mkdir -p "$RUNNER_TEMP/playwright" && chmod 777 "$RUNNER_TEMP/playwright"
      - name: Images locales puis essais (app-base, services, front, Compose, nginx, Playwright)
        env:
          LEPALIER_E2E_RESULTATS_HOTE: ${{ runner.temp }}/playwright
        run: make test-plateforme
      # traces Playwright pour diagnostiquer un échec ; elles contiennent des cookies de session et des clés TOTP
      # de comptes d'essai (plateforme jetable) : conservation courte, jamais sur une réussite
      - name: Résultats Playwright en cas d'échec (7 jours)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-playwright
          path: ${{ runner.temp }}/playwright/resultats
          retention-days: 7
          if-no-files-found: ignore
