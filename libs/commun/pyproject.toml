[project]
name = "commun"
version = "0.1.0"
description = "Bibliothèque commune aux services : enveloppe d'événement, outbox/inbox, identité, décimales. Aucune logique métier."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.9",
  "sqlalchemy>=2.0",
  "nats-py>=2.9",
  "uuid-utils>=0.9",
  "opentelemetry-api>=1.27",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "hypothesis>=6",
  "httpx>=0.27",
  "opentelemetry-sdk>=1.27",
  "jsonschema>=4.23",
  "rfc3339-validator>=0.1",
  "psycopg[binary]>=3.2",
  "testcontainers[postgres]>=4.8",
  "mypy>=1.11",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commun"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --cov=commun --cov-report=term-missing --cov-fail-under=95"
markers = ["integration: nécessite Docker (PostgreSQL, NATS via Testcontainers)"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
