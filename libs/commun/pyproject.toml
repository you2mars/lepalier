[project]
name = "commun"
version = "0.1.0"
description = "Bibliothèque commune aux services : enveloppe d'événement, outbox/inbox, identité, décimales. Aucune logique métier."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "sqlalchemy>=2.0",
  "nats-py>=2.9",
  "uuid-utils>=0.9",
  "opentelemetry-api>=1.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commun"]
